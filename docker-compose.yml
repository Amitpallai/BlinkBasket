version: "3.9"

services:
  server:
    build:
      context: ./server
    container_name: grocery-mart-server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_server_URL: http://localhost:4000
    container_name: grocery-mart-client
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
